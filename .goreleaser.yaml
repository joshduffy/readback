version: 2
project_name: readback
builds:
  - main: ./cmd/readback
    binary: readback
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/joshduffy/readback/internal/cli.Version={{.Version}}
archives:
  - name_template: readback_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: readback
    binaries: [readback]
    repository:
      owner: joshduffy
      name: homebrew-tap
    homepage: https://github.com/joshduffy/readback
    description: Agent ops for your own machine. Agents claim; readback verifies.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/readback"]
          end
release:
  draft: false
