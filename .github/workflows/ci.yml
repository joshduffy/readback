# CI is dispatch-only until the CI route for this repo is registered in
# ~/.claude/routing/ci-routes.json. Local gate is `make check` via pre-commit.
# To arm: replace `workflow_dispatch: {}` with `push: {branches: [main]}` and
# `pull_request: {}` after registering the route.
name: ci
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
