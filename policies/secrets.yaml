# readback policy pack: secrets in arguments
version: 1
name: secrets
rules:
  - id: token-in-argv
    on: [Bash]
    match: '(sk-ant-|sk-live_|ghp_|gho_|AKIA)[A-Za-z0-9_\-]{8,}'
    action: deny
    reason: A credential appears in a command line; it would land in shell history and the provider transcript.
